packages:
  - apps/*
  - packages/*

allowBuilds:
  esbuild: true
  unrs-resolver: false

catalog:
  '@eslint/js': ^10.0.1
  '@types/node': ^24.0.0
  eslint: ~10.10.0
  eslint-config-prettier: ^10.1.8
  globals: ^17.12.0
  prettier: ^3.9.8
  turbo: ~2.10.13
  typescript: ~6.0.3
  typescript-eslint: ^8.70.0
  vitest: ^5.0.1
  zod: ^4.6.5

peerDependencyRules:
  ignoreMissing:
    - react-dom
